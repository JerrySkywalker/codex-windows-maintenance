name: Windows maintenance checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate structure and script syntax
        shell: pwsh
        run: |
          $required = @('README.md', 'LICENSE', 'manifest.json', 'CONTRIBUTING.md', 'scripts/bootstrap.ps1', 'scripts/qualify.ps1', 'scripts/port.ps1', 'harness/windows-presentation/observe-windows.ps1', 'harness/windows-presentation/mock_responses.py', 'harness/windows-presentation/mcp_smoke_server.py', 'harness/windows-presentation/hook_smoke.py', 'harness/windows-presentation/POLICY.md', 'harness/windows-presentation/SPAWN-INVENTORY.md')
          $required += @('scripts/build-candidate.ps1', 'scripts/qualify-candidate.ps1', 'scripts/test-hardening.ps1',
            'harness/windows-presentation/candidate_mapping.py', 'harness/windows-presentation/daemon_rpc.py',
            'harness/windows-presentation/qualify_candidate.py', 'harness/windows-presentation/windows_native.py',
            'harness/windows-presentation/LifetimeFixture.cs', 'harness/windows-presentation/bundled_rg_probe.py',
            'harness/windows-presentation/test_hardening.py',
            'harness/windows-presentation/validate_windows_fixtures.py', 'harness/windows-presentation/CANDIDATE-QUALIFICATION.md')
          $required += @('scripts/validate-source.ps1', 'harness/windows-presentation/source_validation.py',
            'harness/windows-presentation/source_fixture_contract.py', 'harness/windows-presentation/source_fixture_host.py',
            'harness/windows-presentation/SourceFixtureSynthetic.cs',
            'harness/windows-presentation/test_source_fixture_contract.py', 'harness/windows-presentation/test_source_fixture_host.py',
            'harness/windows-presentation/test_source_fixture_accounting.py', 'harness/windows-presentation/probe_fixture_host.py')
          foreach ($path in $required) { if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing $path" } }
          foreach ($path in (Get-ChildItem scripts,harness -Recurse -Filter '*.ps1').FullName) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell syntax errors in $path`: $($errors -join '; ')" }
          }
          $manifest = Get-Content manifest.json -Raw | ConvertFrom-Json
          if (-not $manifest.downstreamTag -or -not $manifest.downstreamCommit -or -not $manifest.downstreamTree) { throw 'Incomplete source mapping' }
          python -c "import ast, pathlib; [ast.parse(path.read_text(encoding='utf-8')) for path in pathlib.Path('harness').rglob('*.py')]"
      - name: Record native host capability without changing Jobs
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP 'wbp-host-capability'
          New-Item -ItemType Directory -Path $probeDir | Out-Null
          $probeExe = Join-Path $probeDir 'Synthetic.exe'
          $compiler = Join-Path $env:SystemRoot 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          & $compiler /nologo /target:exe /platform:x64 /reference:System.Web.Extensions.dll "/out:$probeExe" harness/windows-presentation/SourceFixtureSynthetic.cs
          if ($LASTEXITCODE -ne 0) { throw 'Host probe compile failed' }
          python -B harness/windows-presentation/probe_fixture_host.py --binary $probeExe --output (Join-Path $probeDir 'host.json')
          if ($LASTEXITCODE -ne 0) { throw 'Host probe cleanup failed' }
      - name: Focused candidate and daemon contract tests
        shell: pwsh
        run: ./scripts/test-hardening.ps1 -Python (Get-Command python).Source -OutputDir "$env:RUNNER_TEMP/wbp-hardening"
